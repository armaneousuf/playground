<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetching pokemon</title>
  </head>
  <body>
    <input
      type="text"
      id="pokemonName"
      placeholder="Enter Your Pokemon"
    />
    <button id="fetchImage">Fetch Data</button><br />
    <img src="" alt="pokemon Image" id="pokemonImage" style="display: none;"/>

    <script>
      async function fetchData() {
        try {
          const pokemonName = document.querySelector("#pokemonName").value.toLowerCase();
          
          const response = await fetch(
            `https://pokeapi.co/api/v2/pokemon/${pokemonName}`,
          );

          if (!response.ok) {
            throw new Error("Could not fetch data");
          }

          const data = await response.json();
          const pokemonSprite = data.sprites.front_default;
          const imgElement = document.querySelector('#pokemonImage');

          imgElement.src = pokemonSprite;
          imgElement.style.display = 'block';

        } catch (error) {
          console.error(error);
        }
      }

      document.querySelector('#fetchImage').addEventListener('click', fetchData);
    </script>
  </body>
</html>
