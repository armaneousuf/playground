<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form class="weather-form">
        <input type="text" class="city-input" placeholder="enter your city">
        <button type="submit" class="weather-btn">Get Weather</button>
    </form>

    <div class="card">
        <div class="current-time">
            <span>00:00</span>
        </div>
        <h1 class="city-display">Narayanganj</h1>
        <p class="temp-display">90°</p>
        <p class="humidity-display">51%</p>
        <p class="desc-display">the weather is hot</p>
        <p class="weather-emoji">⛅</p>
        <p class="err-display">Please enter a city</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
