<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini-Project (Interactive Item Adder)</title>
  </head>
  <body>
    <input type="text" id="item-input" placeholder="Enter new item..." />
    <button id="add-btn">Add Item</button>

    <ul id="user-list"></ul>

    <script>
        const inputItem = document.querySelector('#item-input'); 
        const addBtn = document.querySelector('#add-btn');
        const userList = document.querySelector('#user-list');
        
        addBtn.addEventListener('click', () => {
            if(inputItem.value.trim() !== ''){
                const newItem = document.createElement('li');
                newItem.textContent = inputItem.value;

                userList.append(newItem)
                inputItem.value = ''
                
            } else{
                alert('noooo')
            }
        })
    </script>
  </body>
</html>
