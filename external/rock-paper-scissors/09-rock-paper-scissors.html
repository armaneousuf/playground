<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock paper scissors</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button class="rock">Rock</button>
    <button class="paper">Paper</button>
    <button class="scissors">Scissors</button>
    <p class="result"></p>
    <p class="decision"></p>
    <p class="update-score"></p>
    <button class="reset">Reset</button>
    <script>
      const rock = document.querySelector(".rock");
      const paper = document.querySelector(".paper");
      const scissors = document.querySelector(".scissors");
      const update = document.querySelector(".update-score");
      const resultEl = document.querySelector(".result");
      const decision = document.querySelector(".decision");
      const reset = document.querySelector(".reset");
      const score = JSON.parse(localStorage.getItem("score")) || {
        wins: 0,
        losses: 0,
        ties: 0,
      };

      function generateRandomNumber() {
        const randomNumber = Math.floor(Math.random() * 3);
        if (randomNumber === 0) {
          return "rock";
        } else if (randomNumber === 1) {
          return "paper";
        } else {
          return "scissors";
        }
      }

      function updateScore() {
        update.textContent = `Wins ${score.wins} Losses ${score.losses} Ties ${score.ties}`;
      }

      function playGame(playerMove) {
        const computer = generateRandomNumber();
        let result = "";

        if (playerMove === "rock") {
          if (computer === "rock") {
            result = `It's a tie`;
          } else if (computer === "paper") {
            result = `You lose`;
          } else {
            result = `You won`;
          }
        } else if (playerMove === "paper") {
          if (computer === "rock") {
            result = `You won`;
          } else if (computer === "paper") {
            result = `It's a tie`;
          } else {
            result = `You lose`;
          }
        } else if (playerMove === "scissors") {
          if (computer === "rock") {
            result = `You lose`;
          } else if (computer === "paper") {
            result = `You won`;
          } else {
            result = `It's a tie`;
          }
        }

        if (result === "You won") {
          score.wins++;
        } else if (result === "You lose") {
          score.losses++;
        } else if (result === `It's a tie`) {
          score.ties++;
        }

        resultEl.textContent = `${result}`;

        localStorage.setItem("score", JSON.stringify(score));
        updateScore();
        updateScoreElement(playerMove, computer)
      }

      function updateScoreElement(playerMove, computerMove) {
        decision.textContent = `You chose ${playerMove} and computer chose ${computerMove}`;
      }

      function resetGame() {
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem("score");
        updateScore();
        resultEl.textContent = "";
        decision.textContent = "Score has been reset";
      }

      rock.addEventListener("click", () => playGame("rock"));
      paper.addEventListener("click", () => playGame("paper"));
      scissors.addEventListener("click", () => playGame("scissors"));
      reset.addEventListener("click", resetGame);
      updateScore()
    </script>
  </body>
</html>
